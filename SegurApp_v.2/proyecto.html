<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SegurApp - Ingreso</title>



    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">




    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">



    <link rel="stylesheet" href="CSS/proyecto.css">

</head>


<body>


    <main class="container-fluid min-vh-100 d-flex align-items-center">

        <div class="row login-container mx-auto shadow-lg overflow-hidden">



            <section class="col-lg-7 login-banner p-0">

                <img src="IMGS/imagen-login.jpeg" alt="SegurApp" class="img-fluid">

            </section>



            <section class="col-lg-5 login-form">



                <div class="text-center mb-3">

                    <img src="IMGS/logoSegurApp.png" alt="Logo de SegurApp" class="logo-login">

                </div>



                <h1 class="text-center mb-4">

                    Ingreso al Sistema

                </h1>



                <div class="alert alert-info alert-dismissible fade show" role="alert">

                    <i class="bi bi-info-circle-fill me-2"></i>

                    <strong>Bienvenido.</strong>
                    Ingresa tus datos para continuar.


                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>

                </div>


                <form action="Dashboard.html" method="get">

                    <!-- CORREO -->
                    <div class="mb-3">

                        <label for="correo" class="form-label">
                            Correo electrónico
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-envelope-fill"></i>
                            </span>

                            <input type="email" class="form-control" id="correo" name="correo"
                                placeholder="segurapp@gmail.com" required>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label for="contrasena" class="form-label">
                            Contraseña
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>

                            <input type="password" class="form-control" id="contrasena" name="contrasena"
                                placeholder="********" required>

                        </div>

                    </div>


                    <div class="text-end mb-4">

                        <a href="recuperar.contraseña.html" class="link-recuperar">
                            <i class="bi bi-key-fill"></i>
                            ¿Olvidaste tu contraseña?
                        </a>

                    </div>


                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Entrar
                    </button>

                </form>


                <div class="text-center mt-4">

                    <a href="index.html" class="text-decoration-none">

                        <i class="bi bi-arrow-left"></i>

                        Volver

                    </a>

                </div>


            </section>

        </div>

    </main>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
